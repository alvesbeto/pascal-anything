name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fpc

      - name: Install Free Pascal (macOS)
        if: runner.os == 'macOS'
        run: brew install fpc

      - name: Install Free Pascal (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install freepascal -y --no-progress
          # Prefer win64 compiler when the dual installer left it; else i386.
          $roots = @('C:\tools\freepascal', 'C:\FPC\3.2.2', 'C:\FPC')
          $binCandidates = @(
            'bin\x86_64-win64',
            'bin\i386-win32'
          )
          $found = $null
          $fpcRoot = $null
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            foreach ($rel in $binCandidates) {
              $dir = Join-Path $root $rel
              if (Test-Path (Join-Path $dir 'fpc.exe')) {
                $found = $dir
                $fpcRoot = $root
                break
              }
            }
            if ($found) { break }
          }
          if (-not $found) {
            $hit = Get-ChildItem -Path 'C:\tools','C:\FPC','C:\lazarus' -Filter fpc.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($hit) {
              $found = $hit.DirectoryName
              $fpcRoot = Split-Path (Split-Path $found -Parent) -Parent
            }
          }
          if (-not $found) { throw 'fpc.exe not found after Chocolatey install' }

          # Silent Chocolatey installs often skip a usable fpc.cfg → missing RTL/FCL units.
          $mkcfg = Join-Path $found 'fpcmkcfg.exe'
          $cfg = Join-Path $found 'fpc.cfg'
          if ((Test-Path $mkcfg) -and $fpcRoot) {
            Write-Host "Generating fpc.cfg with basepath=$fpcRoot"
            & $mkcfg -d "basepath=$fpcRoot" -o $cfg
          }

          Write-Host "Using FPC at $found"
          $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$found;$env:Path"
          & (Join-Path $found 'fpc.exe') -iV
          # Sanity: FCL Process unit must resolve
          $probe = Join-Path $env:RUNNER_TEMP 'fpc_probe.pas'
          Set-Content -Path $probe -Value "program p; uses Process; begin end."
          & (Join-Path $found 'fpc.exe') -FE"$env:RUNNER_TEMP" $probe
          if ($LASTEXITCODE -ne 0) { throw 'FPC cannot compile with unit Process — install incomplete' }

      - name: Validate docs
        if: runner.os == 'Linux'
        run: python3 scripts/validate_project.py

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ./bin/pascalanything version
          ./bin/pascalanything doctor
          ./bin/pascalanything help >/dev/null
          python3 scripts/validate_project.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          ./scripts/build.ps1
          ./bin/pascalanything.exe version
          ./bin/pascalanything.exe doctor
          ./bin/pascalanything.exe help | Out-Null

      - name: Demo gate (Unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="$PWD/bin:$PATH"
          DEMO=demo/slug-py
          ./bin/pascalanything record "$DEMO/pascal/slug_pas" --inputs "$DEMO/inputs.jsonl"
          ./bin/pascalanything build "$DEMO/pascal/slug_pas"
          ./bin/pascalanything gate "$DEMO/pascal/slug_pas"

      - name: Demo gate (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          $DEMO = "demo/slug-py"
          ./bin/pascalanything.exe record "$DEMO/pascal/slug_pas" --inputs "$DEMO/inputs.jsonl"
          ./bin/pascalanything.exe build "$DEMO/pascal/slug_pas"
          ./bin/pascalanything.exe gate "$DEMO/pascal/slug_pas"

